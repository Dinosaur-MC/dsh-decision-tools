# dsh-decision-tools — 把本机 Ollama 的 System One 决策能力注册成模型工具。
#
# 行说明：
#   decision-tools-tool — 注册 `decision` 工具（模型可见名由配置项 toolName 决定），
#     本插件不依赖平台，任何环境都注册。使用指引在工具 description 里，不注册 prompt 段（ADR-5）。
#
# 本行**不需要任何配置**，故下面没有 `config:` 键 —— Config 的键全部走插件默认值
# （键表见 README / README.zh.md 的 Configuration 小节；它与 Config 的投影对齐由测试守卫把守）。
#
# 可选 per-machine 覆盖（写在你自己的 patch 层里）—— **覆盖既有行**要用「裸 `id` + 无 `insert`」：
#   - id: decision-tools-tool
#     config:
#       baseUrl: 'http://localhost:11434'
#       defaultModel: 'tev1:0.8b'
#       timeoutMs: 180000
#       toolName: 'decision'
#       keepAlive: '30m'
#
# 配置**必须写在行的 `config:` 键下**；把字段平铺在行上会被**静默忽略**（`EntryOptions` 只认
# id/name/config/group/disabled/inject/intercept/isolate，且只有 `options.config` 会传给插件）。
# patch 会**替换整行 config**（绝不深合并），故覆盖时必须重述该行用到的全部字段。
#
# 两种操作别混：`insert:` 是**新增行**（本 bundle 自己的 patch 就是这么注册的，见下）；
# **覆盖既有行**用裸 `id`、**不带 `insert`**。

- insert:
    # 主插件：注册 `decision` 工具。
    - id: decision-tools-tool
      name: 'dsh-decision-tools'
    # 随包 Skill（ADR-10）：**独立入口**，缺技能注册表的组合里它不激活，而上面那行照常工作。
    # v2 刻意**默认启用**（第一方 `dsh-skill-badge` 的惯例是默认 `disabled: true` 让部署显式选择，
    # 这里不走那条过渡路：用法指引在 v2 里是功能件）。
    - id: decision-tools-skill
      name: 'dsh-decision-tools/skill'
