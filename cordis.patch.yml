# dsh-decision-tools — 四行：核心/模型、decision、monitor、skill。
#
# 行说明：
#   decision-tools-plugin — 核心行。裸包名是刻意的：Web 客户端只从裸包名行的
#     package.json 读取 dsh.client + exports["./client"]，浏览器半（Plugins 页的
#     Configure 表单）只能由这一行携带。核心行不注册模型工具；它把共享模型配置
#     （baseUrl / defaultModel / timeoutMs / keepAlive / escalationEnabled / ladder）
#     发布到 lib/config-bus.js，并持有 toolName / monitorToolName / spillDirCap。
#     核心行关闭时两个工具仍用内置默认值工作，但 Plugins 页的 Configure 入口消失。
#
#   decision-tools-decision — 只注册 decision 工具；Config 只含判定行为与 modelOverride。
#   decision-tools-monitor  — 只注册 monitor 工具；Config 只含探测/通知默认值与 modelOverride。
#   decision-tools-skill    — 随包 decision-usage skill，保持独立启停。
#
# 开关：Plugins 页的行开关就是唯一启停机制；没有 decisionEnabled/monitorEnabled 之类的
# 第二层布尔开关。关掉一行只少该行的工具，其他行不受影响。
#
# 配置写在行的 config: 键下（不是平铺在行上）；覆盖既有行用「裸 id + 无 insert」，
# patch 会整块替换该行 config（不深合并）。
#
# GUI 可改字段在 Config 里声明 .volatile()；保存后下一次工具调用生效，无需重启/重载行。
# toolName / monitorToolName / ladder / spillDirCap 是注册期或高级 YAML 项，改后重载对应行。

- insert:
    - id: decision-tools-plugin
      name: 'dsh-decision-tools'
      # 可选共享模型覆盖（示例）：
      #   config:
      #     baseUrl: 'http://localhost:11434'
      #     defaultModel: 'tev1:0.8b'
      #     timeoutMs: 180000
      #     keepAlive: '30m'

    - id: decision-tools-decision
      name: 'dsh-decision-tools/decision'
      # 可选判定行为覆盖（示例）：
      #   config:
      #     modelOverride: 'tev1:0.8b'
      #     defaultDepth: normal

    - id: decision-tools-monitor
      name: 'dsh-decision-tools/monitor'
      # 可选探测/通知覆盖（示例）：
      #   config:
      #     modelOverride: 'nimble:latest'
      #     minProbeIntervalMs: 1000

    - id: decision-tools-skill
      name: 'dsh-decision-tools/skill'
