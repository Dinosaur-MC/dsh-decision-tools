# dsh-decision-tools — 把本机 Ollama 的 System One 决策能力注册成模型工具。
#
# 行说明：
#   decision-tools-tool — 注册 `decision` 工具（模型可见名由配置项 toolName 决定），
#     本插件不依赖平台，任何环境都注册。使用指引在工具 description 里，不注册 prompt 段（ADR-5）。
#
# 本行**不需要任何配置**，故下面没有 `config:` 键 —— Config 的五个键全部走插件默认值。
#
# 可选 per-machine 覆盖 —— 配置**必须写在行的 `config:` 键下**；把字段平铺在行上会被
# **静默忽略**（`EntryOptions` 只认 id/name/config/group/disabled/inject，且只有
# `options.config` 会传给插件）。patch 会**替换整行 config**，故启用时需重述全部字段：
#   - insert:
#       - id: decision-tools-tool
#         name: 'dsh-decision-tools'
#         config:
#           baseUrl: 'http://localhost:11434'
#           defaultModel: 'tev1:0.8b'
#           timeoutMs: 180000
#           toolName: 'decision'
#           keepAlive: '30m'

- insert:
    - id: decision-tools-tool
      name: 'dsh-decision-tools'
